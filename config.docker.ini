; 容器内配置。路径相对 backend/ 解析，因此 ../data 即 /app/data。
; 与 Windows 版唯一实质差别：端口固定 8000（compose 负责对外映射），
; 以及媒体目录由挂载提供、不写死 Windows 盘符。

[server]
host = 0.0.0.0
port = 8000

[paths]
data_dir = ../data
covers_dir = ../data/covers
frontend_dir = ../frontend
info_dir = ../info

[cors]
allow_origins = *
allow_credentials = true
allow_methods = *
allow_headers = *

[scrape]
save_cover = true
timeout = 15
default_delay = 0.5
default_retry = 1

[page]
default_page_size = 24
max_page_size = 100

[sources]
sources_json = [{"id": "fanza", "name": "Fanza", "enabled": true, "priority": 1, "url": "https://www.dmm.co.jp/mono/dvd/-/detail/=/cid={code}/", "official_url": "https://www.dmm.co.jp/", "anti_bot": false}, {"id": "avbase", "name": "Avbase", "enabled": true, "priority": 2, "url": "https://www.avbase.net/works/{code}", "official_url": "https://www.avbase.net/", "anti_bot": false}, {"id": "av-wiki", "name": "Av-Wiki", "enabled": true, "priority": 3, "url": "https://av-wiki.net/works/{code}", "official_url": "https://av-wiki.net/", "anti_bot": true}, {"id": "javcup", "name": "JavCup", "enabled": true, "priority": 4, "url": "https://www.javcup.com/works/{code}", "official_url": "https://www.javcup.com/", "anti_bot": false}, {"id": "avdanyuwiki", "name": "Avdanyuwiki", "enabled": true, "priority": 5, "url": "https://avdanyuwiki.com/works/{code}", "official_url": "https://avdanyuwiki.com/", "anti_bot": false}, {"id": "javdb", "name": "JavDB", "enabled": true, "priority": 6, "url": "https://javdb.com/v/{code}", "official_url": "https://javdb.com/", "anti_bot": true}, {"id": "javsee", "name": "JavSee", "enabled": true, "priority": 7, "url": "https://javsee.bond/v/{code}", "official_url": "https://javsee.bond/", "anti_bot": false}, {"id": "jav321", "name": "Jav321", "enabled": true, "priority": 8, "url": "https://www.jav321.com/video/{code}", "official_url": "https://www.jav321.com/", "anti_bot": false}]
